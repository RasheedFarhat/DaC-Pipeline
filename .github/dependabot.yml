version: 2
updates:
  # Python dependencies. Direct deps live in requirements.in; requirements.txt is the
  # pip-compile-generated lock. `allow: direct` makes Dependabot track only the direct
  # deps (regenerating the lock), so transitive pins (e.g. pydantic-core, locked by
  # pydantic) no longer spawn their own PRs. Minor + patch bumps are grouped into a
  # single PR; majors open individually for review.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    allow:
      - dependency-type: "direct"
    groups:
      python-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot bumps the
  # pinned commit and updates the trailing version comment). Minor + patch bumps
  # grouped; majors open individually.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
