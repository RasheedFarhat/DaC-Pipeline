name: Validate Rules and IDs

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tooling Tests (Pytest)
        run: pytest tests/

      - name: Lint Sigma Logic
        run: python scripts/validate_sigma.py

      - name: Build XML Artifacts (The Missing Compiler)
        run: python scripts/compile_sigma.py

      - name: Validate IDs and Linkage
        run: python scripts/check_rule_ids.py
