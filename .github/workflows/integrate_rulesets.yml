name: CI Pipeline (Build & Validate)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'rules/**.yml'
      - 'rules/**.yaml'
      - 'scripts/**.py'
      - 'templates/**.j2'
      - 'pipeline.yaml'
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest tests/ -v --tb=short

      - name: Validate Sigma Syntax
        run: python scripts/validate_sigma.py

      - name: Compile Rules
        run: python scripts/compile_sigma.py

      - name: Validate Rule IDs
        run: python scripts/check_rule_ids.py

      - name: Upload Compiled Rules Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wazuh-xml-rules
          path: build/wazuh/
          retention-days: 7
