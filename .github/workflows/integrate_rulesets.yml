name: Deploy Rules to Wazuh (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**.yml'
      - 'rules/**.yaml'
      - 'scripts/**.py'
      - 'templates/**.j2'
      - 'configs/**.conf'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Virtual Environment & Install Dependencies
        run: |
          python3 -m venv ci_venv --without-pip
          source ci_venv/bin/activate
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3
          python3 -m pip install -r requirements.txt

      - name: Build XML Artifacts (The Missing Compiler)
        run: |
          source ci_venv/bin/activate
          python3 scripts/compile_sigma.py

      - name: Deploy to Wazuh API
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
        run: |
          source ci_venv/bin/activate
          python3 scripts/deploy_rule.py
