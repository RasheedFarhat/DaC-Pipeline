name: CI Pipeline (Build & Validate)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'rules/**.yml'
      - 'rules/**.yaml'
      - 'scripts/**.py'
      - 'templates/**.j2'
      - 'pipeline.yaml'
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type-check (mypy)
        run: mypy --ignore-missing-imports scripts/

      - name: Run Tests
        run: pytest tests/ -v --tb=short

      - name: Validate Sigma Syntax
        run: python scripts/validate_sigma.py

      - name: Compile Rules
        run: python scripts/compile_sigma.py

      - name: Validate Rule IDs
        run: python scripts/check_rule_ids.py

      - name: Upload Compiled Rules Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wazuh-xml-rules
          path: build/wazuh/
          retention-days: 7
