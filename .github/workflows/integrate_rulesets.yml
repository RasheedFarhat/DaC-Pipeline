name: CI Pipeline (Build & Validate)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'rules/**.yml'
      - 'rules/**.yaml'
      - 'scripts/**.py'
      - 'templates/**.j2'
      - 'pipeline.yaml'
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest tests/ -v --tb=short

      - name: Validate Sigma Syntax
        run: python scripts/validate_sigma.py

      - name: Compile Rules
        run: python scripts/compile_sigma.py

      - name: Validate Rule IDs
        run: python scripts/check_rule_ids.py

      # compile_sigma.py auto-assigns Wazuh IDs and rewrites id_registry.json only when
      # new rules appear. Persist that back to the branch so IDs stay stable across runs
      # instead of being reassigned on every build. Push-only (PRs can't push back) and
      # guarded on a real change; [skip ci] keeps it from re-triggering this workflow.
      - name: Persist rule ID registry
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- id_registry.json; then
            echo "id_registry.json unchanged; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add id_registry.json
          git commit -m "chore(ci): persist auto-assigned rule IDs [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Compiled Rules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-xml-rules
          path: build/wazuh/
          retention-days: 7
