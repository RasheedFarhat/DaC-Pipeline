name: Deploy Rules to Wazuh (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**.yml'
      - 'rules/**.yaml'
      - 'scripts/**.py'
      - 'templates/**.j2'
      - 'configs/**.conf'
  workflow_dispatch:

# CI HARDENING: Prevent concurrent deployments from stepping on each other
concurrency:
  group: production-deployment
  cancel-in-progress: false

# CI HARDENING: Principle of least privilege for the GitHub token
permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: self-hosted

    # CI HARDENING: Tie this job to a protected GitHub Environment
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Virtual Environment & Install Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build XML Artifacts (The Missing Compiler)
        run: |
          source venv/bin/activate
          python3 scripts/compile_sigma.py

      - name: Deploy to Wazuh API
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
          # Note: If prod uses an internal PKI, you would pass the cert here:
          # WAZUH_CA_BUNDLE: ${{ secrets.WAZUH_CA_BUNDLE }}
        run: |
          source venv/bin/activate
          python3 scripts/deploy_rule.py
