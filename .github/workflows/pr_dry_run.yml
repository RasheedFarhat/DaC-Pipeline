name: PR Dry Run (Deployment Simulation)

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  pull-requests: write
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Compile Rules
        run: python scripts/compile_sigma.py

      - name: Execute Dry Run
        id: dry_run
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
        run: |
          # Disable immediate exit on error to capture output
          set +e
          OUTPUT=$(python scripts/deploy_rule.py --dry-run 2>&1)
          EXIT_CODE=$?

          # Safely pass multi-line output to next step
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "deploy_output<<$EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1 # Fail the step AFTER capturing
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Post Comment to PR
        if: always() # Forces this to run even if the dry-run step fails
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.dry_run.outputs.deploy_output }}`;
            const status = `${{ steps.dry_run.outputs.status }}`;
            const icon = status === 'success' ? '✅' : '❌';
            const body = `### ${icon} Wazuh Dry Run Results\n\`\`\`text\n${output}\n\`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
