name: CD Pipeline (Production Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create virtual environment
        run: python3.11 -m venv venv

      - name: Install Dependencies
        run: venv/bin/pip install -r requirements.txt

      - name: Run Tests
        run: venv/bin/python3 -m pytest tests/ -v --tb=short

      - name: Validate Sigma Rules
        run: venv/bin/python3 scripts/validate_sigma.py

      - name: Compile Rules
        run: venv/bin/python3 scripts/compile_sigma.py

      - name: Validate Rule IDs
        run: venv/bin/python3 scripts/check_rule_ids.py

      - name: Deploy to Wazuh API
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
          WAZUH_VERIFY_TLS: ${{ secrets.WAZUH_VERIFY_TLS }}
        run: venv/bin/python3 scripts/deploy_rule.py
