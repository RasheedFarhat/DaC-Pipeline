name: CD Pipeline (Production Deploy)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest tests/ -v --tb=short

      - name: Validate Sigma Rules
        run: python scripts/validate_sigma.py rules/sigma/

      - name: Compile Rules
        run: python scripts/compile_sigma.py

      - name: Validate Rule IDs
        run: python scripts/check_rule_ids.py

      - name: Deploy to Wazuh API
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
        run: python scripts/deploy_rule.py
