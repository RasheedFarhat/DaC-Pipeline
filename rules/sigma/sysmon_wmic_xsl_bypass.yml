title: Suspicious WMIC XSL Script Execution
id: a56a6427-0c71-464a-89a5-71cb6353d712
wazuh_id: 200005
status: experimental
description: Detects WMIC executing a local or remote XSL file, a common AppLocker bypass mechanism (MITRE T1220).
author: Rasheed Farhat
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'os'
            - 'get'
        CommandLine|contains:
            - '/format:'
            - '/FORMAT:'
            - '/Format:'
    selection_payload:
        CommandLine|contains:
            - '.xsl'
            - 'http://'
            - 'https://'
            - '\\'
    condition: selection_process and selection_payload
falsepositives:
    - Highly customized legacy administrative scripts.
level: high
