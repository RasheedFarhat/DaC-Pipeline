title: Suspicious Certutil Network Connection
id: c8d8b9e5-9c8f-4318-8f53-27df8a213564
status: experimental
description: Detects Certutil downloading files, a common living-off-the-land (LOLBin) technique (MITRE T1105).
author: Rasheed Farhat
date: 2026-06-13
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|all:
            - 'urlcache'
            - 'split'
    condition: selection
level: high
tags:
    - attack.command_and_control
    - attack.t1105
